<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ajustes do lar</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bedrock/tokens.css">
<link rel="stylesheet" href="ds/bedrock/components/bundle.css">
<link rel="stylesheet" href="home.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="hm-phone" data-theme="{{theme}}">
<header class="hm-head"><div class="hm-head__text"><span class="hm-title">Nosso lar</span><span class="hm-sub">Plano todo dia às 7:00 · São Paulo</span></div></header>
<div class="hm-scroll"></div>
<div class="hm-overlay">
<section class="hm-sheet" role="dialog" aria-modal="true" aria-labelledby="h-title">
<span class="hm-sheet__grab" aria-hidden="true"></span>
<div class="hm-sheet__head"><h1 id="h-title" class="hm-sheet__title">Ajustes do lar</h1><a class="br-iconbtn br-iconbtn--sm" href="Home.dc.html" aria-label="Fechar"><i class="ri ri-x" aria-hidden="true"></i></a></div>
<label class="hm-field"><span class="hm-label">Nome do lar</span><input class="hm-input" value="Nosso lar" onInput="{{dirty}}"></label>
<div class="hm-field" style="position: relative"><span class="hm-label" id="tm">Horário do plano</span>
<button class="br-input br-select" style="height: 48px; font-size: 16px" aria-labelledby="tm" aria-haspopup="listbox" aria-expanded="{{listOpen}}" onClick="{{toggleList}}"><span class="hm-row"><i class="ri ri-clock" aria-hidden="true"></i>{{time}}</span><i class="ri ri-chevron-down" aria-hidden="true"></i></button>
<sc-if value="{{showList}}" hint-placeholder-val="{{ false }}">
<div class="br-menu" role="listbox" aria-labelledby="tm" style="position: absolute; left: 0; right: 0; top: 80px; max-height: 240px; overflow-y: auto; z-index: 3">
<sc-for list="{{times}}" as="t" hint-placeholder-count="6"><button class="br-menu__item" role="option" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="border: 0; background: none; width: 100%; flex: none">{{t.label}}<sc-if value="{{t.sel}}" hint-placeholder-val="{{ false }}"><i class="ri ri-check br-menu__check" aria-hidden="true"></i></sc-if></button></sc-for>
</div>
</sc-if>
<span class="hm-caption">A cada 15 minutos. Vale a partir de amanhã; o plano de hoje não muda.</span></div>
<div class="hm-field"><span class="hm-label">Fuso horário</span><button class="br-input br-select" style="height: 48px; font-size: 16px"><span>America/Sao Paulo</span><i class="ri ri-chevron-down" aria-hidden="true"></i></button></div>
<div class="hm-sheet__foot"><button class="br-btn {{saveCls}} br-btn--lg br-btn--block" onClick="{{save}}" disabled="{{clean}}"><i class="ri ri-check" aria-hidden="true"></i>{{saveLabel}}</button></div>
</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { time: '07:00', changed: false, saved: false, open: false }; }
renderVals() {
const s = this.state;
return {
theme: this.props.theme ?? 'dark',
time: s.time, listOpen: s.open ? 'true' : 'false', showList: s.open, toggleList: () => this.setState({ open: !s.open }),
times: Array.from({ length: 96 }, (_, i) => String(Math.floor(i / 4)).padStart(2, '0') + ':' + String((i % 4) * 15).padStart(2, '0')).map((label) => ({ label, sel: s.time === label, on: s.time === label ? 'true' : 'false', pick: () => this.setState({ time: label, changed: true, saved: false, open: false }) })),
dirty: () => this.setState({ changed: true, saved: false }),
clean: !s.changed && !s.saved, save: () => this.setState({ saved: true, changed: false }),
saveLabel: s.saved ? 'Salvo' : 'Salvar', saveCls: s.saved ? 'br-btn--success' : 'br-btn--primary'
};
}
}
</script>
</body>
</html>
