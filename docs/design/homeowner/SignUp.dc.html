<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Criar conta</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bedrock/tokens.css">
<link rel="stylesheet" href="ds/bedrock/components/bundle.css">
<link rel="stylesheet" href="home.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="hm-phone" data-theme="{{theme}}">
<div class="hm-bar"><a class="hm-back" href="SignIn.dc.html"><i class="ri ri-chevron-left" aria-hidden="true"></i>Entrar</a></div>
<div class="hm-auth">
<div class="hm-stack" style="gap: 4px"><h1 class="hm-lead">Criar conta</h1><p class="hm-muted">Um login só seu. Quem mora com você cria o próprio.</p></div>
<form class="hm-stack-16" onsubmit="return false">
<label class="hm-field"><span class="hm-label">E-mail</span><input class="hm-input" type="email" autocomplete="email" placeholder="voce@exemplo.com"></label>
<label class="hm-field"><span class="hm-label">Senha</span><input class="hm-input" type="password" autocomplete="new-password" value="{{pw}}" onInput="{{type}}" aria-describedby="rules"></label>
<ul id="rules" class="hm-stack" style="list-style: none; padding: 0; margin: 0; gap: 4px" aria-live="polite">
<sc-for list="{{rules}}" as="r" hint-placeholder-count="5">
<li class="hm-rule {{r.cls}}"><i class="ri {{r.icon}}" aria-hidden="true"></i>{{r.name}}<span style="position: absolute; left: -9999px">{{r.sr}}</span></li>
</sc-for>
</ul>
<a class="br-btn br-btn--primary br-btn--lg br-btn--block" href="Confirm.dc.html">Criar conta</a>
</form>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { pw: 'casalimpa' }; }
renderVals() {
const p = this.state.pw;
const R = [['Pelo menos 8 caracteres', p.length >= 8], ['Uma letra minúscula', /[a-z]/.test(p)], ['Uma letra maiúscula', /[A-Z]/.test(p)], ['Um número', /[0-9]/.test(p)], ['Um símbolo', /[^A-Za-z0-9]/.test(p)]];
return {
theme: this.props.theme ?? 'dark', pw: p, type: (e) => this.setState({ pw: e.target.value }),
rules: R.map(([name, ok]) => ({ name, cls: ok ? 'hm-rule--ok' : '', icon: ok ? 'ri-circle-check' : 'ri-circle', sr: ok ? ': cumprida' : ': ainda não cumprida' }))
};
}
}
</script>
</body>
</html>
