<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Esqueci a senha</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bedrock/tokens.css">
<link rel="stylesheet" href="ds/bedrock/components/bundle.css">
<link rel="stylesheet" href="home.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="hm-phone" data-theme="{{theme}}">
<div class="hm-bar"><a class="hm-back" href="SignIn.dc.html"><i class="ri ri-chevron-left" aria-hidden="true"></i>Entrar</a></div>
<div class="hm-auth">
<div class="hm-stack" style="gap: 4px"><h1 class="hm-lead">Esqueci a senha</h1><p class="hm-muted">Mandamos um código para criar uma senha nova.</p></div>
<div class="br-stepper" aria-label="Passo 2 de 2: nova senha"><div class="br-stepper__meta"><span>Passo 2 de 2</span><span>Nova senha</span></div><div class="br-stepper__track"><i class="br-stepper__seg br-stepper__seg--done"></i><i class="br-stepper__seg br-stepper__seg--done"></i></div></div>
<div class="br-banner"><i class="ri ri-mail" aria-hidden="true"></i><span class="br-banner__text">Código enviado para abner@exemplo.com.</span></div>
<label class="hm-field"><span class="hm-label">Código</span><input class="hm-input" inputmode="numeric" autocomplete="one-time-code" value="193 027"></label>
<label class="hm-field"><span class="hm-label">Nova senha</span><input class="hm-input br-input--invalid" type="password" autocomplete="new-password" value="casa" aria-invalid="true" aria-describedby="pw-err" style="border-color: var(--danger)"><span id="pw-err" class="br-field__error"><i class="ri ri-alert" aria-hidden="true"></i>Use pelo menos 8 caracteres, com maiúscula, número e símbolo.</span></label>
<div class="hm-foot"><a class="br-btn br-btn--primary br-btn--lg br-btn--block" href="SignIn.dc.html">Salvar nova senha</a></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return { theme: this.props.theme ?? 'dark' }; }
}
</script>
</body>
</html>
