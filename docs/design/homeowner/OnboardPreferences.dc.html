<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Passo 4, preferências</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bedrock/tokens.css">
<link rel="stylesheet" href="ds/bedrock/components/bundle.css">
<link rel="stylesheet" href="home.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="hm-phone" data-theme="{{theme}}">
<div class="hm-bar"><a class="hm-back" href="OnboardRestrictions.dc.html"><i class="ri ri-chevron-left" aria-hidden="true"></i>Voltar</a><a class="br-btn br-btn--ghost" href="OnboardReminders.dc.html">Pular</a></div>
<div class="hm-auth" style="padding-top: 8px">
<div class="br-stepper" aria-label="Passo 4 de 5: preferências"><div class="br-stepper__meta"><span>Passo 4 de 5</span><span>Preferências</span></div><div class="br-stepper__track"><i class="br-stepper__seg br-stepper__seg--done"></i><i class="br-stepper__seg br-stepper__seg--done"></i><i class="br-stepper__seg br-stepper__seg--done"></i><i class="br-stepper__seg br-stepper__seg--done"></i><i class="br-stepper__seg"></i></div></div>
<div class="hm-stack" style="gap: 4px"><h1 class="hm-lead">De que você gosta de cuidar?</h1><p class="hm-muted">Toque uma vez para gosto, de novo para não gosto. O essencial ainda vem primeiro.</p></div>
<div class="hm-row" style="flex-wrap: wrap" role="group" aria-label="Categorias">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="10">
<button class="hm-chip" aria-pressed="{{c.pressed}}" onClick="{{c.cycle}}" aria-label="{{c.name}}: {{c.state}}" style="{{c.style}}"><span class="br-chore__icon br-chore__icon--sm" style="background: var(--chore-{{c.id}}-soft); color: var(--chore-{{c.id}})"><i class="ri ri-sm ri-{{c.id}}" aria-hidden="true"></i></span>{{c.name}}<sc-if value="{{c.hasMark}}" hint-placeholder-val="{{ false }}"><i class="ri {{c.mark}}" aria-hidden="true"></i></sc-if></button>
</sc-for>
</div>
<p class="hm-caption">{{summary}}</p>
<div class="hm-foot"><a class="br-btn br-btn--primary br-btn--lg br-btn--block" href="OnboardReminders.dc.html">Continuar</a></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { v: { laundry: 'like', kitchen: 'like', bathroom: 'dislike' } }; }
renderVals() {
const s = this.state;
const C = [['kitchen', 'Cozinha'], ['bathroom', 'Banheiro'], ['bedroom', 'Quarto'], ['living-room', 'Sala'], ['laundry', 'Roupas'], ['floors', 'Pisos'], ['trash', 'Lixo'], ['outdoor', 'Área externa'], ['pets', 'Animais'], ['other', 'Outros']];
const next = { neutral: 'like', like: 'dislike', dislike: 'neutral' };
const likes = C.filter(([id]) => s.v[id] === 'like').map(([, n]) => n);
const dislikes = C.filter(([id]) => s.v[id] === 'dislike').map(([, n]) => n);
return {
theme: this.props.theme ?? 'dark',
cats: C.map(([id, name]) => { const cur = s.v[id] || 'neutral'; return { id, name, pressed: cur === 'neutral' ? 'false' : 'true', state: { neutral: 'neutro', like: 'gosto', dislike: 'não gosto' }[cur], hasMark: cur !== 'neutral', mark: cur === 'like' ? 'ri-like' : 'ri-dislike', style: cur === 'dislike' ? 'background: var(--surface-hover); border-color: var(--border-strong); border-style: dashed' : '', cycle: () => this.setState({ v: { ...s.v, [id]: next[cur] } }) }; }),
summary: 'Gosto: ' + (likes.join(', ') || 'nada ainda') + '. Não gosto: ' + (dislikes.join(', ') || 'nada') + '.'
};
}
}
</script>
</body>
</html>
