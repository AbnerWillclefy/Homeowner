<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Passo 2, energia base</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bedrock/tokens.css">
<link rel="stylesheet" href="ds/bedrock/components/bundle.css">
<link rel="stylesheet" href="home.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="hm-phone" data-theme="{{theme}}">
<div class="hm-bar"><a class="hm-back" href="OnboardHome.dc.html"><i class="ri ri-chevron-left" aria-hidden="true"></i>Voltar</a></div>
<div class="hm-auth" style="padding-top: 8px">
<div class="br-step-indicator" aria-label="Passo 2 de 5: energia base"><div class="br-step-indicator__meta"><span>Passo 2 de 5</span><span>Energia base</span></div><div class="br-step-indicator__track"><i class="br-step-indicator__seg br-step-indicator__seg--done"></i><i class="br-step-indicator__seg br-step-indicator__seg--done"></i><i class="br-step-indicator__seg"></i><i class="br-step-indicator__seg"></i><i class="br-step-indicator__seg"></i></div></div>
<div class="hm-stack" style="gap: 4px"><h1 class="hm-lead">Quanto você costuma dar conta?</h1><p class="hm-muted">Num dia comum. Nos dias difíceis, o check-in ajusta.</p></div>
<div class="br-choices" role="radiogroup" aria-label="Energia base">
<sc-for list="{{levels}}" as="l" hint-placeholder-count="3">
<button class="br-choice" role="radio" aria-checked="{{l.checked}}" onClick="{{l.pick}}"><span class="br-energy__bars"><sc-for list="{{l.bars}}" as="b" hint-placeholder-count="4"><i class="{{b}}"></i></sc-for></span><span class="br-choice__body">{{l.name}}<span class="br-choice__hint">{{l.hint}}</span></span><i class="ri ri-lg {{l.mark}} br-choice__mark" aria-hidden="true"></i></button>
</sc-for>
</div>
<button class="br-btn br-btn--ghost" style="align-self: flex-start" aria-expanded="{{open}}" onClick="{{toggle}}"><i class="ri {{chev}}" aria-hidden="true"></i>Varia com o dia da semana?</button>
<sc-if value="{{showDays}}" hint-placeholder-val="{{ false }}">
<p class="hm-caption">Ajuste depois em Eu › Energia base, dia por dia.</p>
</sc-if>
<div class="hm-foot"><a class="br-btn br-btn--primary br-btn--lg br-btn--block" href="OnboardRestrictions.dc.html">Continuar</a></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { picked: 'normal', open: false }; }
renderVals() {
const s = this.state;
const L = [['low', 'Baixa', 'Poucas tarefas leves', 2], ['normal', 'Normal', 'Algumas tarefas, leves e médias', 3], ['high', 'Alta', 'Dou conta das pesadas também', 4]];
return {
theme: this.props.theme ?? 'dark',
levels: L.map(([id, name, hint, n]) => ({ name, hint, checked: s.picked === id ? 'true' : 'false', mark: s.picked === id ? 'ri-circle-check' : 'ri-circle', bars: [0, 1, 2, 3].map((i) => (i < n ? 'on' : '')), pick: () => this.setState({ picked: id }) })),
open: s.open ? 'true' : 'false', showDays: s.open, chev: s.open ? 'ri-chevron-down' : 'ri-chevron-right', toggle: () => this.setState({ open: !s.open })
};
}
}
</script>
</body>
</html>
