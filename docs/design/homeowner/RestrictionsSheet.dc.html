<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Restrições</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bedrock/tokens.css">
<link rel="stylesheet" href="ds/bedrock/components/bundle.css">
<link rel="stylesheet" href="home.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="hm-phone" data-theme="{{theme}}">
<div class="hm-scroll"></div>
<div class="hm-overlay">
<section class="hm-sheet" role="dialog" aria-modal="true" aria-labelledby="r-title">
<span class="hm-sheet__grab" aria-hidden="true"></span>
<div class="hm-sheet__head"><div class="hm-stack" style="gap: 0"><h1 id="r-title" class="hm-sheet__title">Restrições</h1><span class="hm-muted">O plano nunca te dá uma tarefa que exige isto. Para um dia só, use o check-in.</span></div><a class="br-iconbtn br-iconbtn--sm" href="Me.dc.html" aria-label="Fechar"><i class="ri ri-x" aria-hidden="true"></i></a></div>
<div>
<sc-for list="{{demands}}" as="d" hint-placeholder-count="4">
<button class="hm-check" role="switch" aria-checked="{{d.checked}}" onClick="{{d.toggle}}"><span class="hm-icotile"><i class="ri {{d.icon}}" aria-hidden="true"></i></span><span class="hm-item__main hm-fill"><span class="hm-item__title">{{d.name}}</span><span class="hm-item__meta">{{d.meta}}</span></span><span class="br-switch" aria-checked="{{d.checked}}"><span class="br-switch__track"></span></span></button>
</sc-for>
</div>
</section>
</div>
<sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}">
<div class="hm-toast" role="status" style="bottom: 24px"><i class="ri ri-circle-check" aria-hidden="true" style="color: var(--positive)"></i><span class="hm-toast__text">{{toast}}</span><button class="br-btn br-btn--ghost br-btn--sm" onClick="{{undo}}">Desfazer</button></div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { on: ['heights'], prev: null, toast: null }; }
renderVals() {
const s = this.state;
const D = [['heavy_lifting', 'Carregar peso', 'ri-weight', '3 afazeres exigem'], ['bending', 'Abaixar-se', 'ri-floors', '2 afazeres exigem'], ['heights', 'Altura', 'ri-alert', '1 afazer exige'], ['strong_chemicals', 'Produtos químicos fortes', 'ri-shield', '1 afazer exige']];
return {
theme: this.props.theme ?? 'dark',
demands: D.map(([id, name, icon, meta]) => { const on = s.on.includes(id); return { name, icon, meta, checked: on ? 'true' : 'false', toggle: () => this.setState({ prev: s.on, on: on ? s.on.filter((x) => x !== id) : [...s.on, id], toast: (on ? 'Removida: ' : 'Adicionada: ') + name.toLowerCase() + '. Vale a partir do próximo plano.' }) }; }),
hasToast: !!s.toast, toast: s.toast, undo: () => this.setState({ on: s.prev || s.on, toast: null })
};
}
}
</script>
</body>
</html>
