<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Convidar</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bedrock/tokens.css">
<link rel="stylesheet" href="ds/bedrock/components/bundle.css">
<link rel="stylesheet" href="home.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="hm-phone" data-theme="{{theme}}">
<header class="hm-head"><div class="hm-head__text"><span class="hm-title">Nosso lar</span><span class="hm-sub">Plano todo dia às 7:00 · São Paulo</span></div></header>
<div class="hm-scroll"></div>
<div class="hm-overlay">
<section class="hm-sheet" role="dialog" aria-modal="true" aria-labelledby="i-title">
<span class="hm-sheet__grab" aria-hidden="true"></span>
<div class="hm-sheet__head"><div class="hm-stack" style="gap: 0"><h1 id="i-title" class="hm-sheet__title">Convidar um morador</h1><span class="hm-muted">Um link de uso único para quem mora com você.</span></div><a class="br-iconbtn br-iconbtn--sm" href="Home.dc.html" aria-label="Fechar"><i class="ri ri-x" aria-hidden="true"></i></a></div>
<dl class="hm-dl">
<div><dt>Vale até</dt><dd>2 de dezembro</dd></div>
<div><dt>Usos</dt><dd>1 pessoa</dd></div>
</dl>
<div class="br-input" style="height: 48px; color: var(--text-muted)"><i class="ri ri-lock" aria-hidden="true"></i><span style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">[endereço do app]/convite/k7Q2…</span></div>
<div class="hm-sheet__foot">
<button class="br-btn {{shareCls}} br-btn--lg br-btn--block" onClick="{{share}}"><i class="ri {{shareIcon}}" aria-hidden="true"></i>{{shareLabel}}</button>
<button class="br-btn br-btn--ghost br-btn--lg br-btn--block" onClick="{{renew}}">{{renewLabel}}</button>
</div>
</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { shared: false, renewed: false }; }
renderVals() {
const s = this.state;
return {
theme: this.props.theme ?? 'dark',
share: () => this.setState({ shared: true }),
shareLabel: s.shared ? 'Link copiado' : 'Compartilhar link do convite', shareCls: s.shared ? 'br-btn--success' : 'br-btn--primary', shareIcon: s.shared ? 'ri-check' : 'ri-share',
renew: () => this.setState({ renewed: true, shared: false }), renewLabel: s.renewed ? 'Novo link criado. O anterior não vale mais.' : 'Criar um link novo'
};
}
}
</script>
</body>
</html>
