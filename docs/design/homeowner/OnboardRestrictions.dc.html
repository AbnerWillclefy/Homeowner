<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Passo 3, restrições</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bedrock/tokens.css">
<link rel="stylesheet" href="ds/bedrock/components/bundle.css">
<link rel="stylesheet" href="home.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="hm-phone" data-theme="{{theme}}">
<div class="hm-bar"><a class="hm-back" href="OnboardBaseline.dc.html"><i class="ri ri-chevron-left" aria-hidden="true"></i>Voltar</a></div>
<div class="hm-auth" style="padding-top: 8px">
<div class="br-step-indicator" aria-label="Passo 3 de 5: restrições"><div class="br-step-indicator__meta"><span>Passo 3 de 5</span><span>Restrições</span></div><div class="br-step-indicator__track"><i class="br-step-indicator__seg br-step-indicator__seg--done"></i><i class="br-step-indicator__seg br-step-indicator__seg--done"></i><i class="br-step-indicator__seg br-step-indicator__seg--done"></i><i class="br-step-indicator__seg"></i><i class="br-step-indicator__seg"></i></div></div>
<div class="hm-stack" style="gap: 4px"><h1 class="hm-lead">Algo que você não pode fazer?</h1><p class="hm-muted">O plano nunca te dá uma tarefa que exige isto. Ninguém mais vê.</p></div>
<div>
<sc-for list="{{demands}}" as="d" hint-placeholder-count="4">
<button class="hm-check" role="checkbox" aria-checked="{{d.checked}}" onClick="{{d.toggle}}"><span class="hm-box {{d.box}}"><i class="ri ri-sm ri-check" aria-hidden="true"></i></span><span class="hm-fill">{{d.name}}</span></button>
</sc-for>
</div>
<div class="hm-foot"><a class="br-btn br-btn--primary br-btn--lg br-btn--block" href="OnboardPreferences.dc.html">{{cta}}</a></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { on: [] }; }
renderVals() {
const s = this.state;
const D = [['heavy_lifting', 'Carregar peso'], ['bending', 'Abaixar-se'], ['heights', 'Altura'], ['strong_chemicals', 'Produtos químicos fortes']];
return {
theme: this.props.theme ?? 'dark',
demands: D.map(([id, name]) => { const on = s.on.includes(id); return { name, checked: on ? 'true' : 'false', box: on ? 'hm-box--on' : '', toggle: () => this.setState({ on: on ? s.on.filter((x) => x !== id) : [...s.on, id] }) }; }),
cta: s.on.length ? 'Continuar' : 'Nenhuma, continuar'
};
}
}
</script>
</body>
</html>
