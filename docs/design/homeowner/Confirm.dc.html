<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Confirmar e-mail</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bedrock/tokens.css">
<link rel="stylesheet" href="ds/bedrock/components/bundle.css">
<link rel="stylesheet" href="home.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="hm-phone" data-theme="{{theme}}">
<div class="hm-bar"><a class="hm-back" href="SignUp.dc.html"><i class="ri ri-chevron-left" aria-hidden="true"></i>Criar conta</a></div>
<div class="hm-auth">
<span class="hm-icotile hm-icotile--brand" style="width: 56px; height: 56px"><i class="ri ri-xl ri-mail" aria-hidden="true"></i></span>
<div class="hm-stack" style="gap: 4px"><h1 class="hm-lead">Confira seu e-mail</h1><p class="hm-muted">Mandamos um código de 6 dígitos para abner@exemplo.com.</p></div>
<label class="hm-field"><span class="hm-label">Código</span>
<span class="hm-code" aria-hidden="true"><span>4</span><span>8</span><span>2</span><span>1</span><span style="border-color: var(--focus); border-width: 2px"></span><span></span></span>
<input type="text" inputmode="numeric" autocomplete="one-time-code" value="4821" style="position: absolute; left: -9999px"></label>
<div class="hm-foot">
<a class="br-btn br-btn--primary br-btn--lg br-btn--block" href="OnboardHome.dc.html">Confirmar</a>
<button class="br-btn br-btn--ghost br-btn--lg br-btn--block">Mandar outro código</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return { theme: this.props.theme ?? 'dark' }; }
}
</script>
</body>
</html>
