<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Catálogo, perguntas</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bedrock/tokens.css">
<link rel="stylesheet" href="ds/bedrock/components/bundle.css">
<link rel="stylesheet" href="home.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="hm-phone" data-theme="{{theme}}">
<div class="hm-bar"><a class="hm-back" href="Chores.dc.html"><i class="ri ri-chevron-left" aria-hidden="true"></i>Afazeres</a></div>
<div class="hm-auth">
<div class="hm-stack" style="gap: 4px"><h1 class="hm-lead">Sobre o seu lar</h1><p class="hm-muted">Com isso sugerimos afazeres. Você revisa antes de salvar.</p></div>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<fieldset class="br-card br-card--compact" style="gap: 0; margin: 0">
<legend class="hm-label" style="float: left; width: 100%; padding-bottom: 8px">{{g.legend}}</legend>
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
<div class="br-counter"><span>{{r.label}}</span><span class="br-counter__ctrl"><button class="br-iconbtn" aria-label="Menos: {{r.label}}" onClick="{{r.dec}}" disabled="{{r.atMin}}"><i class="ri ri-minus" aria-hidden="true"></i></button><span class="br-counter__value" aria-live="polite">{{r.n}}</span><button class="br-iconbtn" aria-label="Mais: {{r.label}}" onClick="{{r.inc}}" disabled="{{r.atMax}}"><i class="ri ri-plus" aria-hidden="true"></i></button></span></div>
</sc-for>
</fieldset>
</sc-for>
<div class="hm-foot">
<a class="br-btn br-btn--primary br-btn--lg br-btn--block" href="CatalogReview.dc.html">Sugerir afazeres</a>
<a class="br-btn br-btn--ghost br-btn--lg br-btn--block" href="Chores.dc.html">Pular e adicionar afazeres depois</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { bedrooms: 2, bathrooms: 1, kitchens: 1, livingRooms: 1, laundryAreas: 1, balcony: 1, yard: 0, garden: 0, dog: 0, cat: 1 }; }
renderVals() {
const s = this.state;
const G = [
['Cômodos', [['bedrooms', 'Quartos'], ['bathrooms', 'Banheiros'], ['kitchens', 'Cozinhas'], ['livingRooms', 'Salas'], ['laundryAreas', 'Áreas de serviço']]],
['Área externa', [['balcony', 'Varandas'], ['yard', 'Quintais'], ['garden', 'Jardins']]],
['Animais de estimação', [['dog', 'Cachorro'], ['cat', 'Gato']]]
];
return {
theme: this.props.theme ?? 'dark',
groups: G.map(([legend, rows]) => ({ legend, rows: rows.map(([k, label]) => ({ label, n: s[k], atMin: s[k] <= 0, atMax: s[k] >= 10, dec: () => this.setState({ [k]: Math.max(0, s[k] - 1) }), inc: () => this.setState({ [k]: Math.min(10, s[k] + 1) }) })) }))
};
}
}
</script>
</body>
</html>
