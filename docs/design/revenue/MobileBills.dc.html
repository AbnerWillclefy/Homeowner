<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Contas a pagar, sheet</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bedrock/tokens.css">
<link rel="stylesheet" href="ds/bedrock/components/bundle.css">
<link rel="stylesheet" href="revenue.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="rv-phone" data-theme="{{theme}}">
<div class="rv-phone__top">
<div class="rv-head__text"><span class="rv-title">Visão geral</span><span class="rv-sub">Hoje, 11 nov</span></div>
</div>
<div class="rv-phone__scroll">
<section class="br-card br-card--hero br-card--compact"><span class="br-card__label">Você ainda pode gastar</span><span class="br-amount br-amount--lg"><span class="br-amount__value">R$ 1.517,25</span></span><span class="br-muted">R$ 75 por dia até 30/11</span></section>
<div class="br-alert"><span class="rv-stack" style="gap: 0; grid-column: 1 / 3"><span class="br-alert__title">{{alertTitle}}</span><span class="br-alert__meta {{alertClass}}">{{alertMeta}}</span></span><i class="ri ri-chevron-right" aria-hidden="true"></i></div>
</div>
<nav class="br-bottombar" aria-label="Principal">
<a href="MobileOverview.dc.html" class="br-tab" aria-current="page"><i class="ri ri-lg ri-dashboard" aria-hidden="true"></i>Visão geral</a>
<a href="MobileTransactions.dc.html" class="br-tab"><i class="ri ri-lg ri-arrows" aria-hidden="true"></i>Transações</a>
<a href="Goals.dc.html" class="br-tab"><i class="ri ri-lg ri-target" aria-hidden="true"></i>Planejamento</a>
<a href="Settings.dc.html" class="br-tab"><i class="ri ri-lg ri-more" aria-hidden="true"></i>Mais</a>
</nav>

<sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
<div class="rv-overlay">
<div style="flex: 1" onClick="{{close}}"></div>
<div class="br-sheet br-sheet--bottom" role="dialog" aria-label="Contas a pagar" style="padding-bottom: 32px">
<span class="br-sheet__grab"></span>
<div class="br-sheet__head"><div class="rv-stack" style="gap: 0"><span class="br-sheet__title">3 contas a pagar</span><span class="br-muted">R$ 475,85 · até 18/11</span></div><button class="br-iconbtn br-iconbtn--sm" aria-label="Fechar" onClick="{{close}}"><i class="ri ri-x" aria-hidden="true"></i></button></div>
<div class="br-list">
<sc-for list="{{bills}}" as="b" hint-placeholder-count="3">
<div class="br-listrow" style="cursor: default">
<span style="position: relative; display: inline-flex"><span class="br-cat__icon" style="background: var(--{{b.tone}}-soft); color: var(--{{b.tone}})"><i class="ri {{b.icon}}" aria-hidden="true"></i></span>
<sc-if value="{{paid}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; right: -4px; bottom: -4px; width: 16px; height: 16px; border-radius: 9999px; background: var(--positive); color: var(--on-brand); display: grid; place-items: center; border: 2px solid var(--surface-raised)"><i class="ri ri-sm ri-check" aria-hidden="true" style="width: 10px; height: 10px"></i></span></sc-if></span>
<div class="br-listrow__main"><span class="br-listrow__title">{{b.title}}</span><span class="br-listrow__meta" style="color: {{b.metaColor}}">{{b.meta}}</span></div>
<span class="br-amount br-amount--sm"><span class="br-amount__value">{{b.amount}}</span></span>
</div>
</sc-for>
</div>
<sc-if value="{{unpaid}}" hint-placeholder-val="{{ true }}"><button class="br-btn br-btn--primary br-btn--lg br-btn--block" onClick="{{pay}}"><i class="ri ri-check" aria-hidden="true"></i>Marcar as 3 como pagas</button></sc-if>
<sc-if value="{{paid}}" hint-placeholder-val="{{ false }}"><button class="br-btn br-btn--success br-btn--lg br-btn--block" onClick="{{undo}}"><i class="ri ri-check" aria-hidden="true"></i>3 contas pagas · Desfazer</button></sc-if>
<span class="br-muted" style="text-align: center; font-size: 12px; line-height: 16px">Só tira da lista. Nada é pago pelo app.</span>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: true, paid: false }; }
  renderVals() {
    const paid = this.state.paid;
    const bills = [
      { title: 'Enel', due: 'vence em 2 dias', tone: 'cat-household-bills', icon: 'ri-zap', amount: 'R$ 214,40', soon: true },
      { title: 'Vivo Fibra', due: 'vence em 4 dias', tone: 'cat-subscriptions', icon: 'ri-repeat', amount: 'R$ 119,90' },
      { title: 'Sabesp', due: 'vence em 7 dias', tone: 'cat-household-bills', icon: 'ri-house', amount: 'R$ 141,55' },
    ].map((b) => ({ ...b, meta: paid ? 'paga hoje' : b.due, metaColor: paid ? 'var(--positive)' : b.soon ? 'var(--warning)' : 'var(--text-muted)' }));
    return {
      theme: this.props.theme ?? 'dark',
      bills, paid, unpaid: !paid, open: this.state.open,
      alertTitle: paid ? 'Contas da semana pagas' : '3 contas a pagar',
      alertMeta: paid ? 'Próxima: aluguel em 05/12' : 'R$ 475,85 · em 2 dias',
      alertClass: paid ? '' : 'br-alert__meta--warning',
      pay: () => this.setState({ paid: true }),
      undo: () => this.setState({ paid: false }),
      close: () => this.setState({ open: false }),
    };
  }
}
</script>
</body>
</html>
