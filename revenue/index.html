<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>Revenue</title>
    <script>
      // Set data-theme before first paint (Bedrock swaps its tokens on it): the stored choice, else the system
      // appearance, else dark. Keep in step with src/shared/theme/theme.ts.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("revenue.theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
