name: Notify ready to merge

# pull_request_target runs the workflow from main, so it also fires on PRs opened
# before it existed. Safe here: it never checks out or runs the PR's code.
on:
  pull_request_target:
    types: [labeled]

jobs:
  notify:
    if: github.event.label.name == 'review-addressed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Post to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_STATS: "+${{ github.event.pull_request.additions }} -${{ github.event.pull_request.deletions }} in ${{ github.event.pull_request.changed_files }} files"
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL is not set; skipping"
            exit 0
          fi
          text=$(printf ':eyes: *PR #%s is ready for your review and merge*\n<%s|%s>\nby %s, %s. Claude has reviewed it and the engineer has addressed the review.' \
            "$PR_NUMBER" "$PR_URL" "$PR_TITLE" "$PR_AUTHOR" "$PR_STATS")
          jq -n --arg text "$text" '{text: $text}' \
            | curl -sS --fail -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
