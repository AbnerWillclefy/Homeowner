name: infra-check

# The only pre-merge check for the Terraform. No AWS credentials: pull
# requests never get any.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: infra-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  infra-check-changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.apps.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: apps
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: .github/scripts/changed-apps.sh "$BASE" >> "$GITHUB_OUTPUT"

  terraform:
    name: infra-check
    needs: infra-check-changes
    # Runs when the changes job failed too, so a broken one cannot read as a skip
    if: ${{ !cancelled() && (needs.infra-check-changes.result != 'success' || needs.infra-check-changes.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive
        working-directory: infra
      - name: terraform validate (every folder)
        run: |
          for dir in infra/bootstrap infra/staging infra/production infra/modules/*; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done
