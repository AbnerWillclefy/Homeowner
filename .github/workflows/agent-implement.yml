name: Agent - Implement ticket

on:
  issues:
    types: [labeled]

jobs:
  implement:
    if: github.event.label.name == 'implement' && !contains(github.event.issue.labels.*.name, 'ready-for-human')
    runs-on: ubuntu-latest
    concurrency:
      group: agent-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AGENTS_GH_TOKEN }}

      - name: Identify the agents' git author
        run: |
          git config user.name "Homeowner Agents"
          git config user.email "${{ vars.AGENTS_GIT_EMAIL }}"

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.AGENTS_GH_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.AGENTS_GH_TOKEN }}
          # Private repo: keep the transcript in the run log for debugging
          show_full_output: true
          # Matt Pocock's skills, for /tdd in the engineer personas
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "mattpocock-skills@claude-plugins-official"
          prompt: |
            This is an unattended run that ends when you stop: run every subagent in the foreground and wait for its result, never in the background.

            Implement issue #${{ github.event.issue.number }} in ${{ github.repository }}, following "Working a ticket" in CLAUDE.md. Read it with `gh issue view ${{ github.event.issue.number }} --comments`.

            Work on a new branch named `${{ github.event.issue.number }}-<short-slug>`, push it, and open the pull request with `gh pr create`. Comment on the issue with the pull request link, then remove the label `implement`.

            If a blocker is still open or the ticket cannot be done as written, comment why on the issue, remove the label `implement`, and stop.
          claude_args: |
            --max-turns 80
            --model sonnet
            --allowedTools "Skill,Edit,Write,Bash(git *),Bash(go *),Bash(gofmt *),Bash(docker *),Bash(npm *),Bash(npx *),Bash(make *),Bash(terraform fmt *),Bash(terraform validate *),Bash(gh issue *),Bash(gh pr create *),Bash(gh pr view *),Bash(gh api *)"
            --disallowedTools "Bash(git push --force *),Bash(git push -f *),Bash(gh pr merge *)"

      - name: Fail if the stage did not finish
        if: always()
        env:
          GH_TOKEN: ${{ secrets.AGENTS_GH_TOKEN }}
        run: |
          labels=$(gh issue view ${{ github.event.issue.number }} -R ${{ github.repository }} --json labels --jq '[.labels[].name] | join(",")')
          if [[ ",$labels," == *",implement,"* ]]; then
            echo "::error::#${{ github.event.issue.number }} still has the implement label, so this stage did not finish. See the Claude step's log."
            exit 1
          fi

  refuse-human-ticket:
    if: github.event.label.name == 'implement' && contains(github.event.issue.labels.*.name, 'ready-for-human')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Explain why no agent picks this up
        env:
          GH_TOKEN: ${{ secrets.AGENTS_GH_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body "**Backend Engineer:** this ticket is labelled \`ready-for-human\`: it needs a step no agent can take, such as a purchase or console access. The maintainer follows its technical notes."
          gh issue edit "$ISSUE" -R "$GITHUB_REPOSITORY" --remove-label implement
