name: admin-typecheck

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: admin-typecheck-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  admin-typecheck-changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.apps.outputs.admin }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: apps
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: .github/scripts/changed-apps.sh "$BASE" >> "$GITHUB_OUTPUT"

  admin-typecheck:
    name: admin-typecheck
    needs: admin-typecheck-changes
    # Runs when the changes job failed too, so a broken one cannot read as a skip
    if: ${{ !cancelled() && (needs.admin-typecheck-changes.result != 'success' || needs.admin-typecheck-changes.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    env:
      VITE_ENVIRONMENT: staging
      VITE_API_URL: http://localhost:8080
      VITE_COGNITO_REGION: eu-west-1
      VITE_COGNITO_CLIENT_ID: dummyclientid
      VITE_ADMIN_URLS: ""
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: admin/.nvmrc
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
