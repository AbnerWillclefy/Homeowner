name: Agent - Apply review

on:
  workflow_run:
    workflows: ["Claude Code Review"]
    types: [completed]

jobs:
  apply-review:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.pull_requests[0]
    runs-on: ubuntu-latest
    concurrency:
      group: agent-pr-${{ github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: false
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      PR: ${{ github.event.workflow_run.pull_requests[0].number }}
      GH_TOKEN: ${{ secrets.AGENTS_GH_TOKEN }}
    steps:
      - name: Fix only agent pull requests with findings, at most two rounds
        id: gate
        env:
          REPO: ${{ github.repository }}
          REVIEW_STARTED: ${{ github.event.workflow_run.created_at }}
          MAX_ROUNDS: 2
        run: |
          echo "run=false" >> "$GITHUB_OUTPUT"
          # A human's pull request is a learning exercise: they apply the review themselves
          author=$(gh pr view "$PR" -R "$REPO" --json author --jq .author.login)
          [ "$author" = "homeowner-agents" ] || exit 0

          findings=$(gh api "repos/$REPO/pulls/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"claude[bot]\" and .in_reply_to_id == null and .created_at >= \"$REVIEW_STARTED\") | .id" | wc -l)
          round=$(gh pr view "$PR" -R "$REPO" --json labels --jq '[.labels[].name | select(startswith("review-round-"))] | length')

          if [ "$findings" -eq 0 ]; then
            gh pr edit "$PR" -R "$REPO" --add-label review-addressed
          elif [ "$round" -ge "$MAX_ROUNDS" ]; then
            gh pr edit "$PR" -R "$REPO" --add-label needs-human
          else
            # Labelled before the fix pushes, so the re-review it triggers sees the round
            gh pr edit "$PR" -R "$REPO" --remove-label review-addressed || true
            gh pr edit "$PR" -R "$REPO" --add-label "review-round-$((round + 1))"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          token: ${{ secrets.AGENTS_GH_TOKEN }}

      - if: steps.gate.outputs.run == 'true'
        name: Identify the agents' git author
        run: |
          git config user.name "Homeowner Agents"
          git config user.email "${{ vars.AGENTS_GIT_EMAIL }}"

      - if: steps.gate.outputs.run == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.AGENTS_GH_TOKEN }}
          # Private repo: keep the transcript in the run log for debugging
          show_full_output: true
          # Matt Pocock's skills, for /tdd in the engineer personas
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "mattpocock-skills@claude-plugins-official"
          prompt: |
            This is an unattended run that ends when you stop: run every subagent in the foreground and wait for its result, never in the background.

            Claude has reviewed pull request #${{ env.PR }} in ${{ github.repository }}. Read the review comments with `gh pr view ${{ env.PR }} --comments` and `gh api repos/${{ github.repository }}/pulls/${{ env.PR }}/comments`.

            Acting as the engineer who owns the change (backend-engineer or frontend-engineer), apply each finding that is correct, keeping the tests green, and commit and push to the pull request's branch. For each finding you reject, reply to it with the reason.

            Then comment on the pull request with what you changed and what you rejected. Do not add or remove labels: the workflow does.
          claude_args: |
            --max-turns 60
            --model sonnet
            --allowedTools "Skill,Edit,Write,Bash(git *),Bash(go *),Bash(gofmt *),Bash(docker *),Bash(npm *),Bash(npx *),Bash(make *),Bash(gh pr *),Bash(gh api *)"
            --disallowedTools "Bash(git push --force *),Bash(git push -f *),Bash(gh pr merge *)"

