name: backend-test

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend-test-changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.apps.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: apps
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: .github/scripts/changed-apps.sh "$BASE" >> "$GITHUB_OUTPUT"

  backend-test:
    name: backend-test
    needs: backend-test-changes
    # Runs when the changes job failed too, so a broken one cannot read as a skip
    if: ${{ !cancelled() && (needs.backend-test-changes.result != 'success' || needs.backend-test-changes.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go test -race ./...
