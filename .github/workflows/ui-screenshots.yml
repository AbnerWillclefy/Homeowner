name: ui-screenshots

# A pull request that changes the UI shows it in its description, under headings this check fills in itself:
# the web app's screens in pt-BR and dark theme next to their artboards under "### pt-BR" (web/e2e/pairs, against the
# e2e fakes), Revenue's under "### Mobile" and "### Desktop" (against .github/scripts/revenue-fake-api.mjs), and a
# Bedrock-only change under "### pt-BR" and "### English" (from the showcase). The implement runner has no browser,
# so agent pull requests arrived without them.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: write # pushes screenshots/<head branch>, deleted by ui-screenshots-cleanup.yml
  pull-requests: write # puts the Bedrock screenshots in the description

concurrency:
  group: ui-screenshots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ui-screenshots:
    name: ui-screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Find the UI change
        id: find
        run: |
          ui_files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename' \
            | grep -E '^web/(src|public)/|^web/index\.html$|^bedrock/(src|showcase)/|^revenue/(src|public)/|^revenue/index\.html$' \
            | grep -vE '\.test\.tsx?$|^web/src/sw|^revenue/src/sw' || true)
          { echo "files<<EOF"; echo "$ui_files"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          [[ -z "$ui_files" ]] && exit 0
          # Each app the change touches is shot; a Bedrock change a web or Revenue pull request carries shows in their shots.
          apps=() headings=()
          if grep -q '^revenue/' <<<"$ui_files"; then apps+=(revenue); headings+=(Mobile Desktop); fi
          if grep -q '^web/' <<<"$ui_files"; then apps+=(web); headings+=(pt-BR); fi
          if (( ${#apps[@]} == 0 )); then apps=(bedrock); headings=(pt-BR English); fi
          echo "apps=${apps[*]}" >> "$GITHUB_OUTPUT"

          body=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .body)
          section() { awk -v h="$1" '/^#/ { inside = ($0 ~ "^### *" h " *$"); next } inside' <<<"${body//$'\r'/}"; }
          has_image() { grep -qE '!\[[^]]*\]\([^)]+\)|<img[^>]+src=' <<<"$1"; }
          # Take them when an image is missing, or when this check took them for an older commit. Any event checks the
          # commit, not only a push: an edit right after a push cancels that push's run (concurrency), so it must shoot.
          missing=false
          for h in "${headings[@]}"; do has_image "$(section "$h")" || missing=true; done
          shot=$(gh api "repos/$GITHUB_REPOSITORY/commits/screenshots/$HEAD_REF" --jq .commit.message 2>/dev/null || true)
          if $missing || { grep -q "/screenshots/$HEAD_REF/auto-" <<<"$body" && [[ "$shot" != *"$HEAD_SHA"* ]]; }; then
            echo "shoot=true" >> "$GITHUB_OUTPUT"
          fi

      # Not gated on shoot: a run that takes no shots (an edit after fresh ones) still guards the spacing.
      - name: Check the added spacing classes are on the 8px grid
        if: steps.find.outputs.files != ''
        env:
          UI_FILES: ${{ steps.find.outputs.files }}
        run: |
          git init -q && git fetch -q --depth 1 "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY" "$HEAD_SHA"
          git checkout -q FETCH_HEAD -- .github/scripts/spacing-grid.mjs
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR/files" | node .github/scripts/spacing-grid.mjs

      - uses: actions/checkout@v4
        if: steps.find.outputs.shoot
      - uses: actions/setup-node@v4
        if: steps.find.outputs.shoot
        with:
          node-version-file: bedrock/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Screenshot the changed Bedrock sections, Revenue screens or web screens
        if: steps.find.outputs.shoot
        env:
          APPS: ${{ steps.find.outputs.apps }}
          CHANGED: ${{ steps.find.outputs.files }}
          BASE_URL: http://localhost:4175
          API_URL: http://127.0.0.1:8099
          PLAYWRIGHT_DIR: ${{ runner.temp }}/pw/node_modules
        run: |
          npm ci
          case " $APPS " in *" revenue "*) revenue=true ;; *) revenue=false ;; esac
          case " $APPS " in *" web "*) web=true ;; *) web=false ;; esac

          shots="$RUNNER_TEMP/shots"
          if git fetch -q --depth 1 origin "refs/heads/screenshots/$HEAD_REF"; then
            git worktree add -q --detach "$shots" FETCH_HEAD
          else
            git worktree add -q --orphan -b shots "$shots"
          fi
          rm -f "$shots"/auto-*
          prefix="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/screenshots/$HEAD_REF/"
          # Read the description just before writing it: an edit made during the shots must survive.
          body() { gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .body; }

          if [[ "$revenue" == true || "$APPS" == bedrock ]]; then
            if $revenue; then
              # Public dummy values: the fake answers every API call, and the stored session never asks Cognito.
              VITE_API_URL="$API_URL" VITE_COGNITO_REGION=us-east-1 VITE_COGNITO_CLIENT_ID=screenshots \
                VITE_PASSWORD_POLICY='{"minimum_length":10,"require_lowercase":true,"require_uppercase":true,"require_numbers":true,"require_symbols":false}' \
                npm run build -w @homeowner/revenue
              app=revenue
            else
              npm run build:showcase -w @homeowner/bedrock
              app=bedrock
            fi
            (cd "$app" && npx vite preview --port 4175 --strictPort &)

            # The same Playwright as web-e2e; no --with-deps, see web-e2e.yml.
            version=$(jq -r '.packages["node_modules/@playwright/test"].version // .packages["web/node_modules/@playwright/test"].version' package-lock.json)
            npm install --silent --prefix "$RUNNER_TEMP/pw" "playwright@$version"
            "$PLAYWRIGHT_DIR/.bin/playwright" install chromium

            for _ in $(seq 30); do curl -sf "$BASE_URL" >/dev/null && break; sleep 1; done
            # Its own line, so a failed read stops the step instead of writing an empty description.
            BODY=$(body)
            BODY="$BODY" node ".github/scripts/$app-screenshots.mjs" "$shots" "$prefix" > "$RUNNER_TEMP/body.md"
          fi

          if $web; then
            # The capture serves dist-e2e itself (its config's webServer) and answers from the e2e fakes.
            npm run build:e2e -w web
            npx -w web playwright install chromium
            rm -rf web/pairs-results
            PAIRS_OUT="$shots" PAIRS_RESULTS="$PWD/web/pairs-results" npx -w web playwright test -c playwright.pairs.config.ts
            # After a Revenue run the description to extend is the one it just wrote. shortcut: on a Revenue and web
            # change, an edit made during the web capture is overwritten; rare, and editing again fixes it.
            if $revenue; then BODY=$(cat "$RUNNER_TEMP/body.md"); else
              BODY=$(body)
            fi
            BODY="$BODY" PAIRS_RESULTS="$PWD/web/pairs-results" node .github/scripts/web-screenshots.mjs "$prefix" > "$RUNNER_TEMP/body.md"
          fi

          git -C "$shots" add -A
          git -C "$shots" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q --allow-empty -m "chore: $APPS screenshots for $HEAD_SHA"
          git -C "$shots" push -q origin "HEAD:refs/heads/screenshots/$HEAD_REF"
          # Edits with this token start no new run, so the check below reads the description again.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$PR" -F "body=@$RUNNER_TEMP/body.md" >/dev/null

      - name: Check the description has the screenshots it needs
        if: steps.find.outputs.files != ''
        env:
          UI_FILES: ${{ steps.find.outputs.files }}
        run: |
          body=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .body)
          # Prints the text under a "### <name>" heading, up to the next heading.
          section() { awk -v h="$1" '/^#/ { inside = ($0 ~ "^### *" h " *$"); next } inside' <<<"${body//$'\r'/}"; }
          has_image() { grep -qE '!\[[^]]*\]\([^)]+\)|<img[^>]+src=' <<<"$1"; }

          # Revenue shows pt-BR in dark mode at both widths and the web app pt-BR in dark mode, each of which also shows a
          # Bedrock change it carries; Bedrock on its own shows both locales.
          headings=()
          grep -q '^revenue/' <<<"$UI_FILES" && headings+=(Mobile Desktop)
          grep -q '^web/' <<<"$UI_FILES" && headings+=(pt-BR)
          (( ${#headings[@]} )) || headings+=(pt-BR English)
          missing=()
          for h in "${headings[@]}"; do has_image "$(section "$h")" || missing+=("$h"); done
          if (( ${#missing[@]} )); then
            echo "::error::This pull request changes the UI:"
            echo "$UI_FILES"
            echo "::error::Add a screenshot under each heading in the description: ${missing[*]}"
            exit 1
          fi
