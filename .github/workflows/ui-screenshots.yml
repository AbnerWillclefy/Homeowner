name: ui-screenshots

# A pull request that changes the UI shows it in both locales: its description
# has a "### pt-BR" and an "### English" heading, each followed by an image.
# A Revenue change shows its screens in pt-BR and dark theme under "### Mobile" and "### Desktop".
# Unless the web app changes, this takes them itself: Bedrock from the showcase, Revenue against
# .github/scripts/revenue-fake-api.mjs. The implement runner has no browser, so agent pull requests arrived without them.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: write # pushes screenshots/<head branch>, deleted by ui-screenshots-cleanup.yml
  pull-requests: write # puts the Bedrock screenshots in the description

concurrency:
  group: ui-screenshots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ui-screenshots:
    name: ui-screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Find the UI change
        id: find
        env:
          ACTION: ${{ github.event.action }}
        run: |
          ui_files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename' \
            | grep -E '^web/(src|public)/|^web/index\.html$|^bedrock/(src|showcase)/|^revenue/(src|public)/|^revenue/index\.html$' \
            | grep -vE '\.test\.tsx?$|^web/src/sw|^revenue/src/sw' || true)
          { echo "files<<EOF"; echo "$ui_files"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          [[ -z "$ui_files" ]] && exit 0
          grep -q '^web/' <<<"$ui_files" && exit 0 # the web app's screens need its e2e fakes; the engineer takes those
          # Revenue shots also show a Bedrock change they carry.
          if grep -q '^revenue/' <<<"$ui_files"; then app=revenue headings=(Mobile Desktop); else app=bedrock headings=(pt-BR English); fi
          echo "app=$app" >> "$GITHUB_OUTPUT"

          body=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .body)
          section() { awk -v h="$1" '/^#/ { inside = ($0 ~ "^### *" h " *$"); next } inside' <<<"${body//$'\r'/}"; }
          has_image() { grep -qE '!\[[^]]*\]\([^)]+\)|<img[^>]+src=' <<<"$1"; }
          # Take them when an image is missing, and again on a new commit if this check took them before.
          missing=false
          for h in "${headings[@]}"; do has_image "$(section "$h")" || missing=true; done
          if $missing || { [[ "$ACTION" != edited ]] && grep -q "/screenshots/$HEAD_REF/auto-" <<<"$body"; }; then
            echo "shoot=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.find.outputs.shoot
      - uses: actions/setup-node@v4
        if: steps.find.outputs.shoot
        with:
          node-version-file: bedrock/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Screenshot the changed Bedrock sections or Revenue screens
        if: steps.find.outputs.shoot
        env:
          APP: ${{ steps.find.outputs.app }}
          CHANGED: ${{ steps.find.outputs.files }}
          BASE_URL: http://localhost:4175
          API_URL: http://127.0.0.1:8099
          PLAYWRIGHT_DIR: ${{ runner.temp }}/pw/node_modules
        run: |
          npm ci
          if [[ "$APP" == revenue ]]; then
            # Public dummy values: the fake answers every API call, and the stored session never asks Cognito.
            VITE_API_URL="$API_URL" VITE_COGNITO_REGION=us-east-1 VITE_COGNITO_CLIENT_ID=screenshots \
              VITE_PASSWORD_POLICY='{"minimum_length":10,"require_lowercase":true,"require_uppercase":true,"require_numbers":true,"require_symbols":false}' \
              npm run build -w @homeowner/revenue
          else
            npm run build:showcase -w @homeowner/bedrock
          fi
          (cd "$APP" && npx vite preview --port 4175 --strictPort &)

          # The same Playwright as web-e2e; no --with-deps, see web-e2e.yml.
          version=$(jq -r '.packages["node_modules/@playwright/test"].version' web/package-lock.json)
          npm install --silent --prefix "$RUNNER_TEMP/pw" "playwright@$version"
          "$PLAYWRIGHT_DIR/.bin/playwright" install chromium

          shots="$RUNNER_TEMP/shots"
          if git fetch -q --depth 1 origin "refs/heads/screenshots/$HEAD_REF"; then
            git worktree add -q --detach "$shots" FETCH_HEAD
          else
            git worktree add -q --orphan -b shots "$shots"
          fi
          rm -f "$shots"/auto-*

          for _ in $(seq 30); do curl -sf "$BASE_URL" >/dev/null && break; sleep 1; done
          prefix="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/screenshots/$HEAD_REF/"
          BODY=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .body) \
            node ".github/scripts/$APP-screenshots.mjs" "$shots" "$prefix" > "$RUNNER_TEMP/body.md"

          git -C "$shots" add -A
          git -C "$shots" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "chore: $APP screenshots" || true
          git -C "$shots" push -q origin "HEAD:refs/heads/screenshots/$HEAD_REF"
          # Edits with this token start no new run, so the check below reads the description again.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$PR" -F "body=@$RUNNER_TEMP/body.md" >/dev/null

      - name: Check the description has the screenshots it needs
        if: steps.find.outputs.files != ''
        env:
          UI_FILES: ${{ steps.find.outputs.files }}
        run: |
          body=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .body)
          # Shots this check took do not show the web app's screens.
          if grep -q '^web/' <<<"$UI_FILES"; then
            body=$(grep -v "/screenshots/$HEAD_REF/auto-" <<<"$body" || true)
          fi
          # Prints the text under a "### <name>" heading, up to the next heading.
          section() { awk -v h="$1" '/^#/ { inside = ($0 ~ "^### *" h " *$"); next } inside' <<<"${body//$'\r'/}"; }
          has_image() { grep -qE '!\[[^]]*\]\([^)]+\)|<img[^>]+src=' <<<"$1"; }

          # Revenue shows pt-BR in dark mode at both widths, which also shows a Bedrock change it carries;
          # the web app, and Bedrock on its own, show both locales.
          headings=()
          if grep -q '^revenue/' <<<"$UI_FILES"; then
            headings+=(Mobile Desktop)
            grep -q '^web/' <<<"$UI_FILES" && headings+=(pt-BR English)
          else
            headings+=(pt-BR English)
          fi
          missing=()
          for h in "${headings[@]}"; do has_image "$(section "$h")" || missing+=("$h"); done
          if (( ${#missing[@]} )); then
            echo "::error::This pull request changes the UI:"
            echo "$UI_FILES"
            echo "::error::Add a screenshot under each heading in the description: ${missing[*]}"
            exit 1
          fi
