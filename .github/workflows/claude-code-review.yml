# agent-review-fix.yml triggers on this exact name. Renaming it silently stops the fix stage,
# so change the `workflows:` trigger there in the same PR.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  # One review across correctness, security, performance, tests, docs and maintainability
  # (.claude/skills/pr-review, plus the repository rules in REVIEW.md). merge-by-risk.sh requires
  # this job's name as a check, so rename it there too.
  claude-review:
    runs-on: ubuntu-latest
    # A new push to the PR supersedes the review still running on the old one
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            /pr-review Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            If the pull request has a `review-round-*` label, this is a re-review after the engineer applied the previous round. Raise only correctness, security or missing-test defects, and regressions introduced since the last round. Never re-raise a rejected finding, and never ask to undo the previous round's changes.
          claude_args: |
            --max-turns 60
            --model opus
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff *),Bash(gh pr view *),Bash(gh pr comment *),Bash(gh api *)"
