name: web-typecheck

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: web-typecheck-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  web-typecheck-changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.apps.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: apps
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: .github/scripts/changed-apps.sh "$BASE" >> "$GITHUB_OUTPUT"

  web-typecheck:
    name: web-typecheck
    needs: web-typecheck-changes
    # Runs when the changes job failed too, so a broken one cannot read as a skip
    if: ${{ !cancelled() && (needs.web-typecheck-changes.result != 'success' || needs.web-typecheck-changes.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: http://localhost:8080
      VITE_PASSWORD_POLICY: '{"minimum_length":10,"require_lowercase":true,"require_uppercase":true,"require_numbers":true,"require_symbols":false}'
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      # Root install: web is a workspace member, so the lock file is the root one.
      - run: npm ci
        working-directory: .
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle
