name: Merge by risk

# Merges the agents' low-risk pull requests, and medium-risk ones the maintainer approved,
# into main, which deploys staging. High risk is always merged by hand.
# Rules: .github/scripts/merge-by-risk.sh and docs/agents/pr-risk.md.
#
# workflow_run always runs this file and its scripts from main, never from the pull
# request, so a pull request cannot change the rules that merge it.
on:
  workflow_run:
    # Whichever finishes last wakes the merge: CI, Claude's review, the review fix, or the maintainer's approval (PR risk)
    workflows: ["PR risk", "Claude Code Review", "Agent - Apply review", "backend-test", "web-typecheck", "web-e2e", "infra-check", "ui-screenshots"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number (empty checks every open agent pull request)
        required: false

# One merger at a time. GitHub keeps one queued run and drops older ones, so every
# run sweeps all open agent pull requests and a dropped run loses nothing.
concurrency:
  group: merge-by-risk
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  merge:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'pull_request_review' || github.event.workflow_run.event == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Merge what the risk tier allows
        env:
          # The agents' token, so the push to main starts Deploy staging (GITHUB_TOKEN pushes start no workflows)
          GH_TOKEN: ${{ secrets.AGENTS_GH_TOKEN }}
          AGENT_LOGIN: homeowner-agents
          MAINTAINER_LOGIN: AbnerWillclefy
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PR: ${{ inputs.pr }}
        run: .github/scripts/merge-by-risk.sh ${PR:+"$PR"}
