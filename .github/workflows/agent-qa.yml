name: Agent - QA staging

on:
  workflow_run:
    workflows: ["Deploy staging"]
    types: [completed]
  workflow_dispatch:

jobs:
  qa:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: agent-qa
      cancel-in-progress: false
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      STAGING_WEB_URL: ${{ vars.STAGING_WEB_URL }}
      STAGING_API_URL: ${{ vars.STAGING_API_URL }}
      STAGING_QA_EMAIL: ${{ secrets.STAGING_QA_EMAIL }}
      STAGING_QA_PASSWORD: ${{ secrets.STAGING_QA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install a headless browser for testing
        run: |
          mkdir -p "$RUNNER_TEMP/qa" && cd "$RUNNER_TEMP/qa"
          npm init -y >/dev/null
          npm install --no-save playwright@1.47.2
          npx playwright install --with-deps chromium

      - name: Check staging is configured
        run: |
          if [ -z "$STAGING_WEB_URL" ] || [ -z "$STAGING_API_URL" ]; then
            echo "::error::Set the STAGING_WEB_URL and STAGING_API_URL repository variables (see infra/README.md)."
            exit 1
          fi

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.AGENTS_GH_TOKEN }}
          QA_WORKDIR: ${{ runner.temp }}/qa
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.AGENTS_GH_TOKEN }}
          # Private repo: keep the transcript in the run log for debugging
          show_full_output: true
          prompt: |
            This is an unattended run that ends when you stop: run every subagent in the foreground and wait for its result, never in the background.

            Staging was just deployed for ${{ github.repository }}. Use the qa-engineer subagent to test what changed since the previous successful run of this workflow (find it with `gh run list --workflow "Agent - QA staging" --status success --limit 2`), and file bugs as it describes.

            Staging (not secret, given here because reading environment variables needs approval nobody can give in this run):
            - web app: ${{ vars.STAGING_WEB_URL }}
            - API: ${{ vars.STAGING_API_URL }}
            - Playwright is installed in ${{ runner.temp }}/qa; write and run your test scripts there (`cd ${{ runner.temp }}/qa && node <script>.js`), never in the repository.
            - QA sign-in credentials are in the STAGING_QA_EMAIL and STAGING_QA_PASSWORD environment variables; read them only from inside a test script (`process.env`), never print them. Until sign-in exists (#8) they may be empty: test what needs no account.
          claude_args: |
            --max-turns 60
            --model haiku
            --allowedTools "Write,Bash(node *),Bash(npx playwright *),Bash(curl *),Bash(cd *),Bash(git log *),Bash(gh issue *),Bash(gh pr list *),Bash(gh pr view *),Bash(gh run list *),Bash(gh api *)"
