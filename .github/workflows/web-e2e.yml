name: web-e2e

# No paths or branches filter on purpose: a required check that never runs would stay pending.
# A web-e2e-changes job skips the check instead, and a skipped required check counts as passed.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: web-e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  web-e2e-changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.apps.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: apps
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: .github/scripts/changed-apps.sh "$BASE" >> "$GITHUB_OUTPUT"

  web-e2e:
    name: web-e2e
    needs: web-e2e-changes
    # Runs when the changes job failed too, so a broken one cannot read as a skip
    if: ${{ !cancelled() && (needs.web-e2e-changes.result != 'success' || needs.web-e2e-changes.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      # Root install: web is a workspace member, so the lock file is the root one.
      - run: npm ci
        working-directory: .
      # The public dummy values come from web/.env.e2e; nothing here is a secret.
      - run: npm run build:e2e
      # The lock file pins Playwright, which pins the Chromium build, so it is the cache key.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # Skips a browser already restored from the cache. No --with-deps: the runner image already has
      # Chromium's libraries, and the extra fonts it adds made the job fail whenever the Ubuntu mirrors were unreachable.
      - run: npx playwright install chromium
      - run: npx playwright test
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
